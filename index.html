<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d1813">
  <script>try{document.documentElement.dataset.skin=localStorage.getItem('uborka.skin')==='classic'?'classic':'pixel'}catch(e){document.documentElement.dataset.skin='pixel'}</script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Уборка">
  <title>Уборка</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Nunito:wght@400;500;600;700&family=Tiny5&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/pixel.css">
</head>
<body>
  <main id="view" class="view"></main>
  <button class="note-fab" data-act="note" aria-label="Записать, что неудобно">✎</button>

  <nav class="tabs" id="tabs">
    <button data-tab="now" class="on"><span class="ti">☼</span>Сейчас</button>
    <button data-tab="home"><span class="ti">⌂</span>Комнаты</button>
    <button data-tab="score"><span class="ti">★</span>Итоги</button>
    <button data-tab="settings"><span class="ti">⚙</span>Настройки</button>
  </nav>

  <section id="setup" class="session setup" hidden></section>
  <section id="session" class="session" hidden></section>
  <div id="sheet-bg" class="sheet-bg" hidden></div>
  <section id="sheet" class="sheet" hidden></section>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
